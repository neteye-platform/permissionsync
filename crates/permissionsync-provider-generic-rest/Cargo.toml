[package]
name = "permissionsync-provider-generic-rest"
description = "Concrete Generic REST Permission Provider for PermissionSync"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
bytes = { version = "=1.11.1", default-features = false }
hickory-net = { version = "=0.26.2", default-features = false, features = ["tokio"] }
hickory-resolver = { version = "=0.26.2", default-features = false, features = ["system-config"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
mime = { version = "=0.3.17", default-features = false }
native-tls = { version = "=0.2.18", default-features = false }
permissionsync-core = { path = "../permissionsync-core" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["raw_value", "std"] }
tokio = { version = "=1.52.3", default-features = false, features = ["net", "rt", "time"] }
tokio-native-tls = { version = "=0.3.1", default-features = false }

[dev-dependencies]
openssl = { version = "=0.10.81", default-features = false }
tokio = { version = "=1.52.3", default-features = false, features = ["io-util", "macros", "sync", "test-util"] }

[lints]
workspace = true
