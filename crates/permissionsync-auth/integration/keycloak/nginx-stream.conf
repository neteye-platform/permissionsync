# Disposable layer-4 forwarder used only by the metadata-outage test.
#
# This deliberately proxies the raw TCP stream instead of terminating TLS: the
# client negotiates TLS with Keycloak itself, so the certificate and hostname
# the real production authentication code validates are unchanged, and nothing
# here can weaken the trust chain under test.
#
# `keycloak` is resolved once at startup. bootstrap.sh starts this service only
# after Keycloak is already serving, so the name always resolves.

events {}

stream {
  server {
    listen 8444;
    proxy_pass keycloak:8443;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
  }
}
