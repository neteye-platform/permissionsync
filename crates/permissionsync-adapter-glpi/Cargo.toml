[package]
name = "permissionsync-adapter-glpi"
description = "Concrete GLPI Target Adapter for PermissionSync"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
bytes = { version = "=1.12.1", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
native-tls = { version = "=0.2.18", default-features = false }
permissionsync-core = { path = "../permissionsync-core" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["net", "rt", "time"] }
tokio-native-tls = { version = "=0.3.1", default-features = false }
url = { version = "=2.5.8", default-features = false }

[dev-dependencies]
openssl = { version = "=0.10.81", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util"] }

[lints]
workspace = true
