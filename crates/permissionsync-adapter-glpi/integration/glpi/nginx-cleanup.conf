# Logs only non-secret timestamp, method, and upstream status facts. It never
# includes URI, headers, tokens, request content, or selectors.
log_format killsession_only '$time_iso8601 $request_method $upstream_status';

server {
    listen 8444 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log off;

    location = /apirest.php/killSession {
        access_log /var/log/nginx/killsession/killsession.log killsession_only;
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
    }
}
