# Logs only non-secret facts (timestamp, method, status). Never interpolate
# headers here: Session-Token, App-Token, and Authorization are headers and
# must never be logged.
log_format killsession_only '$time_iso8601 $request_method $status';

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /apirest.php/killSession {
        access_log /var/log/nginx/killsession/killsession.log killsession_only;
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
    }
}
