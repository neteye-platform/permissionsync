# Logs only non-secret timestamp, method, and status facts. It never includes
# headers, so Session-Token, App-Token, and Authorization cannot be logged.
log_format killsession_only '$time_iso8601 $request_method $status';

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Normal GLPI requests can carry identities and selectors in their URLs.
    # Keep nginx's default request logging disabled for strict redaction.
    access_log off;

    location / {
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
    }
}

server {
    listen 8444 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # This listener is exclusively for the cleanup proof; ordinary tests use
    # the 8443 listener and cannot write its dedicated non-secret log.
    access_log off;

    location = /apirest.php/killSession {
        access_log /var/log/nginx/killsession/killsession.log killsession_only;
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
    }
}
