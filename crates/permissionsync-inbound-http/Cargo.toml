[package]
name = "permissionsync-inbound-http"
description = "Framework-neutral inbound HTTP boundary for PermissionSync"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
permissionsync-auth = { path = "../permissionsync-auth", version = "=0.1.0" }
permissionsync-core = { path = "../permissionsync-core", version = "=0.1.0" }
permissionsync-orchestration = { path = "../permissionsync-orchestration", version = "=0.1.0" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[dev-dependencies]
permissionsync-routing = { path = "../permissionsync-routing", version = "=0.1.0" }

[lints]
workspace = true
