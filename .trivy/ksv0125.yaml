# Trusted registries for built-in check KSV0125, "Restrict container images to
# trusted registries".
#
# The check stays enabled for every workload in this repository and keeps
# reporting any other registry. Only its generic default registry list is
# replaced, because this repository publishes its own production image to GHCR
# through its own release workflow.
#
# KSV0125 evaluates the registry host, so trusting ghcr.io trusts that host.
# The narrower repository-specific guarantee is enforced separately by
# tests/oci_packaging.rs, which requires the example deployment to reference
# exactly ghcr.io/neteye-platform/permissionsync pinned by immutable digest.
ksv0125:
  trusted_registries:
    - ghcr.io
