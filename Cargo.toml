[workspace]
members = [
  "crates/permissionsync-adapter-glpi",
  "crates/permissionsync-core",
  "crates/permissionsync-auth",
  "crates/permissionsync-inbound-http",
  "crates/permissionsync-orchestration",
  "crates/permissionsync-provider-generic-rest",
  "crates/permissionsync-routing",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/neteye-platform/permissionsync"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "permissionsync"
description = "PermissionSync service"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
permissionsync-adapter-glpi = { path = "crates/permissionsync-adapter-glpi", version = "=0.1.0" }
permissionsync-core = { path = "crates/permissionsync-core", version = "=0.1.0" }
permissionsync-provider-generic-rest = { path = "crates/permissionsync-provider-generic-rest", version = "=0.1.0" }
permissionsync-routing = { path = "crates/permissionsync-routing", version = "=0.1.0" }

[lints]
workspace = true
