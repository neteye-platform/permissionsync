[workspace]
members = [
  "crates/permissionsync-adapter-glpi",
  "crates/permissionsync-core",
  "crates/permissionsync-auth",
  "crates/permissionsync-inbound-http",
  "crates/permissionsync-orchestration",
  "crates/permissionsync-provider-generic-rest",
  "crates/permissionsync-routing",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/neteye-platform/permissionsync"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "permissionsync"
description = "PermissionSync service"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
http = { version = "=1.5.0", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1", "server"] }
hyper-tls = { version = "=0.6.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "server", "service", "tokio"] }
libc = { version = "=0.2.189", default-features = false }
metrics = { version = "=0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
native-tls = { version = "=0.2.18", default-features = false }
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "=0.33.0", default-features = false, features = ["hyper"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["http-proto", "trace"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["experimental_trace_batch_span_processor_with_async_runtime", "rt-tokio", "trace"] }
permissionsync-adapter-glpi = { path = "crates/permissionsync-adapter-glpi", version = "=0.1.0" }
permissionsync-auth = { path = "crates/permissionsync-auth", version = "=0.1.0" }
permissionsync-core = { path = "crates/permissionsync-core", version = "=0.1.0" }
permissionsync-inbound-http = { path = "crates/permissionsync-inbound-http", version = "=0.1.0" }
permissionsync-orchestration = { path = "crates/permissionsync-orchestration", version = "=0.1.0" }
permissionsync-provider-generic-rest = { path = "crates/permissionsync-provider-generic-rest", version = "=0.1.0" }
permissionsync-routing = { path = "crates/permissionsync-routing", version = "=0.1.0" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
yaml_serde = { version = "=0.10.7", default-features = false, features = ["std"] }

[dev-dependencies]
bytes = { version = "=1.12.1", default-features = false }
http-body = { version = "=1.1.0", default-features = false }
josekit = { version = "=0.10.3", default-features = false }
openssl = { version = "=0.10.81", default-features = false }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "test-util"] }
tokio-native-tls = { version = "=0.3.1", default-features = false }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[lints]
workspace = true
