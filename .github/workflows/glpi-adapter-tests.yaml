---
name: GLPI Adapter Tests

"on":
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  glpi-adapter-tests:
    name: GLPI Adapter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Bootstrap disposable GLPI environment
        working-directory: crates/permissionsync-adapter-glpi/tests/real-glpi
        run: ./bootstrap.sh

      - name: Run the real GLPI integration suite
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -a
          # shellcheck disable=SC1090
          source "$GLPI_TEST_RUNTIME_ENV"
          set +a
          cargo test -p permissionsync-adapter-glpi --test real_glpi --locked \
            -- --ignored

      - name: Collect GLPI container logs on failure
        if: failure()
        working-directory: crates/permissionsync-adapter-glpi/tests/real-glpi
        run: |
          if [[ -z "${GLPI_TEST_RUNTIME_ENV:-}" || ! -f "${GLPI_TEST_RUNTIME_ENV:-/nonexistent}" ]]; then
            printf '%s\n' 'bootstrap failed before runtime initialization; no docker logs available'
            exit 0
          fi
          # shellcheck disable=SC1090
          source "$GLPI_TEST_RUNTIME_ENV"
          # Diagnostics are best-effort here: the primary failure is already
          # recorded by the earlier step, and a missing compose project (e.g.
          # bootstrap failed before `compose up` ever ran) must not mask it or
          # fail this already-diagnostic-only step.
          docker compose --env-file "$GLPI_TEST_RUNTIME_ENV" \
            -p "$PERMISSIONSYNC_GLPI_PROJECT_NAME" \
            logs --no-color glpi db tls-proxy || printf '%s\n' 'docker compose logs unavailable; project may not have started.'

      - name: Tear down the disposable environment
        if: always()
        working-directory: crates/permissionsync-adapter-glpi/tests/real-glpi
        run: ./teardown.sh
