# Publishes the production PermissionSync OCI image for one released semantic
# version.
#
# This runs only for a semantic version tag pushed to this repository, never
# for a pull request, so untrusted pull-request code can never reach a step
# that holds a registry credential. Pull-request validation builds the same
# Dockerfile in the OCI Image Tests workflow with `contents: read` only.
#
# `packages: write` is granted to the publishing job alone, and only
# GitHub's own scoped token is used; this repository adds no long-lived
# registry credential.
name: Release Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # A released version is immutable. The publishing job below would happily
  # overwrite an existing tag, so refuse before it runs when the version is
  # already published. This check needs read access only. It deliberately
  # proceeds when the reference cannot be resolved at all, which is also the
  # normal first-release case; the authoritative protection against reusing a
  # version remains that pushing the same semantic version tag twice has to be
  # a deliberate act.
  unpublished-version:
    name: Verify The Released Version Is Unpublished
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing released version
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/permissionsync
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          reference="${IMAGE_REPOSITORY}:${RELEASE_TAG#v}"
          if docker buildx imagetools inspect "$reference" > /dev/null 2>&1; then
            printf '%s is already published; a released version is immutable.\n' \
              "$reference" >&2
            exit 1
          fi
          printf '%s is not published yet.\n' "$reference"

  # The organization's reusable image workflow is the convention for building
  # and publishing to GHCR: it pins every action by commit SHA, authenticates
  # with the scoped GITHUB_TOKEN, derives the immutable version tag and the
  # standard OCI source, revision, version, and creation labels from the
  # release event, and attaches provenance and an SBOM. It publishes no
  # mutable `latest` tag. It builds for the runner's platform only, so the
  # published image supports linux/amd64, which is also the only platform this
  # repository validates. A job that calls a reusable workflow cannot declare
  # its own `timeout-minutes`; the called workflow owns its job configuration.
  publish-oci-image:
    name: Publish OCI Image
    needs: unpublished-version
    permissions:
      contents: read
      packages: write
    uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@e8e2d702d7a80fc53886bd28a7ddcbb05906180a # main
    with:
      working-directory: .
      dockerfile-path: ./Dockerfile
      image-name: permissionsync
      push: true

  published-digest:
    name: Report The Published Image Digest
    needs: publish-oci-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deployments should pin the image by this digest: ADR-0006 requires that
      # normal restart and recovery never depend on public registry
      # connectivity, which deployment infrastructure provides by retaining or
      # mirroring the selected digest locally.
      - name: Report the published immutable digest
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/permissionsync
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          reference="${IMAGE_REPOSITORY}:${RELEASE_TAG#v}"
          digest="$(docker buildx imagetools inspect "$reference" \
            --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            # A content digest is by definition the SHA-256 of the manifest's
            # own bytes, so recomputing it from the raw manifest is an exact
            # equivalent rather than an approximation.
            digest="sha256:$(docker buildx imagetools inspect "$reference" --raw |
              sha256sum | cut -d ' ' -f 1)"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'could not determine the published digest of %s\n' "$reference" >&2
            exit 1
          fi
          printf 'published %s@%s\n' "$reference" "$digest"
          printf '### Published PermissionSync image\n\n    %s@%s\n' \
            "$reference" "$digest" >> "$GITHUB_STEP_SUMMARY"
