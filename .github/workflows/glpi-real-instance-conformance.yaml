name: GLPI Adapter Conformance (Real Instance)

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  real-glpi-conformance:
    name: Real GLPI Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Bootstrap disposable GLPI environment
        working-directory: crates/permissionsync-adapter-glpi/tests/real-glpi
        run: ./bootstrap.sh > "$RUNNER_TEMP/glpi-env.sh"

      - name: Run the real GLPI integration suite
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -a
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/glpi-env.sh"
          set +a
          cargo test -p permissionsync-adapter-glpi --test real_glpi --locked -- --ignored

      - name: Collect GLPI container logs on failure
        if: failure()
        working-directory: crates/permissionsync-adapter-glpi/tests/real-glpi
        run: |
          if [[ -f .real-glpi-run-env ]]; then
            # shellcheck disable=SC1091
            source .real-glpi-run-env
          fi
          if [[ -n "${PERMISSIONSYNC_GLPI_PROJECT_NAME:-}" ]]; then
            docker compose -p "$PERMISSIONSYNC_GLPI_PROJECT_NAME" logs --no-color glpi db tls-proxy || true
          fi

      - name: Tear down the disposable environment
        if: always()
        working-directory: crates/permissionsync-adapter-glpi/tests/real-glpi
        run: ./teardown.sh
